name: Deploy Firebase

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      APP_DIR: ${{ secrets.APP_DIR }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Esegui test statici
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if [ -n "${APP_DIR:-}" ]; then cd "$APP_DIR"; fi
          npm test

      - name: Autentica Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Installa Firebase CLI
        run: npm install --global firebase-tools@15.28.2

      - name: Pubblica Firebase
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if [ -n "${APP_DIR:-}" ]; then cd "$APP_DIR"; fi
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore --non-interactive
