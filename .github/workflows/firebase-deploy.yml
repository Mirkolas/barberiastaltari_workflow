name: Deploy Firebase

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-barberiastaltari
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica repository privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configura Java per Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa dipendenze di test bloccate
        working-directory: source/barberiastaltari
        run: npm ci

      - name: Verifica comportamento delle prenotazioni e delle email
        working-directory: source/barberiastaltari
        run: npm run test:behavior

      - name: Verifica regole su database demo isolato
        working-directory: source/barberiastaltari
        run: npx --yes firebase-tools@15.28.2 emulators:exec --config firebase.test.json --project demo-staltari-audit --only firestore 'node --test tests/firestore.test.mjs'

      - name: Esegui test statici
        working-directory: source/barberiastaltari
        run: npm test

      - name: Autentica Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: barberiastaltari

      - name: Installa Firebase CLI
        run: npm install --global firebase-tools@15.28.2

      - name: Deploy Hosting, regole e indici Firestore
        working-directory: source/barberiastaltari
        run: firebase deploy --project barberiastaltari --only hosting,firestore --non-interactive
