name: Private source watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza il deploy anche se il sorgente non è cambiato'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: private-source-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Rileva versione privata senza pubblicarla
        id: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          sha="$(gh api "repos/${PRIVATE_REPO}/commits/main" --jq '.sha' 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "::error::Impossibile leggere il repository sorgente con il PAT configurato."
            exit 1
          fi
          digest="$(printf '%s' "$sha" | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          unset sha

      - name: Controlla se questa versione è già stata elaborata
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .private-source-state
          key: private-source-${{ steps.source.outputs.digest }}

      - name: Avvia deploy pubblico
        if: inputs.force == true || steps.source-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run firebase-deploy.yml --ref main
          echo "Nuova versione privata rilevata: deploy pubblico avviato."

      - name: Memorizza solo l'impronta della versione
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .private-source-state
          printf '%s\n' "${{ steps.source.outputs.digest }}" > .private-source-state/version

      - name: Salva impronta senza dati del repository privato
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .private-source-state
          key: private-source-${{ steps.source.outputs.digest }}
