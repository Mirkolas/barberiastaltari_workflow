name: Private source watcher manuale

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza il deploy anche se il sorgente non è cambiato'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: private-source-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.source.outputs.digest }}
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Rileva soltanto la versione del sito
        id: source
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" && test -n "$GH_TOKEN"
          tree="$(gh api "repos/${PRIVATE_REPO}/contents/barberiastaltari?ref=main" --jq 'sort_by(.path) | map([.path,.sha]) | tostring')"
          digest="$(printf '%s' "$tree" | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Leggi ultima pubblicazione riuscita
        id: deployed
        uses: actions/cache/restore@v4
        with:
          path: .private-source-state
          key: deployed-site-${{ steps.source.outputs.digest }}
      - name: Decidi se pubblicare
        id: decision
        env:
          FORCE: ${{ inputs.force }}
          HIT: ${{ steps.deployed.outputs.cache-hit }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$HIT" != "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: watch
    if: needs.watch.outputs.deploy == 'true'
    uses: ./.github/workflows/firebase-deploy.yml
    secrets: inherit

  record-success:
    needs: [watch, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Memorizza soltanto una pubblicazione riuscita
        env:
          DIGEST: ${{ needs.watch.outputs.digest }}
        run: |
          mkdir -p .private-source-state
          printf '%s\n' "$DIGEST" > .private-source-state/version
      - uses: actions/cache/save@v4
        with:
          path: .private-source-state
          key: deployed-site-${{ needs.watch.outputs.digest }}
