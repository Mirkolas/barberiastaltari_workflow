name: Backup Firebase automatico

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/firebase-backup-auto.yml'
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: firebase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica repository privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          fetch-depth: 0
          path: source

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: source
        run: npm install

      - name: Esegui backup Firebase
        working-directory: source
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run backup

      - name: Controlla backup generato
        working-directory: source
        run: |
          echo "Backup disponibili:"
          ls -lah backups
          echo ""
          find backups -maxdepth 2 -type f -print

      - name: Salva backup nel repository privato
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "firebase-backup-bot"
          git config user.email "firebase-backup-bot@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Nessun nuovo backup da salvare."
            exit 0
          fi
          git commit -m "Backup Firebase $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main
