name: Backup Firebase automatico

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read

concurrency:
  group: firebase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Scarica repository pubblico
        uses: actions/checkout@v5

      - name: Verifica accesso repository privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica repository privato solo come destinazione
        uses: actions/checkout@v5
        with:
          repository: Mirkolas/barberiastaltari-backup
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          fetch-depth: 0
          path: private-backup

      - name: Controlla se il backup giornaliero e gia riuscito
        id: daily_backup
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          day="$(date -u '+%Y-%m-%d')"
          found=""

          if [ -d private-backup/backups ]; then
            while IFS= read -r candidate; do
              if [ -f "$candidate/firestore.json" ] \
                && [ -f "$candidate/authentication.json" ] \
                && [ -f "$candidate/metadata.json" ]; then
                found="$candidate"
                break
              fi
            done < <(find private-backup/backups -mindepth 1 -maxdepth 1 -type d -name "${day}T*" -print | sort -r)
          fi

          if [ -n "$found" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Backup UTC di oggi gia presente e valido: $found. Questo tentativo schedulato termina senza creare duplicati."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Nessun backup UTC valido per $day: eseguo questo tentativo."
          fi

      - name: Configura Node.js
        if: steps.daily_backup.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa dipendenze backup
        if: steps.daily_backup.outputs.skip != 'true'
        run: npm install

      - name: Esegui backup Firebase nel runner pubblico
        if: steps.daily_backup.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup-root-only.js

      - name: Controlla backup generato
        if: steps.daily_backup.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Backup generato nel runner pubblico:"
          find backups -maxdepth 2 -type f -print

          new_backup="$(find backups -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)"
          test -n "$new_backup" || { echo "::error::Nessuna cartella backup generata"; exit 1; }

          for file in firestore.json authentication.json metadata.json; do
            test -f "backups/$new_backup/$file" || { echo "::error::$file non trovato nel backup"; exit 1; }
          done

      - name: Salva backup nel repository privato
        if: steps.daily_backup.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          new_backup="$(find backups -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)"
          test -n "$new_backup" || { echo "::error::Nessun backup da salvare"; exit 1; }

          mkdir -p private-backup/backups
          cp -a "backups/$new_backup" "private-backup/backups/"

          mapfile -t backup_folders < <(
            find private-backup/backups -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$' \
              | sort
          )

          if [ "${#backup_folders[@]}" -ge 5 ]; then
            latest="${backup_folders[$((${#backup_folders[@]} - 1))]}"
            echo "Raggiunti ${#backup_folders[@]} backup. Conservo solo il piu recente: $latest"
            for folder in "${backup_folders[@]}"; do
              if [ "$folder" != "$latest" ]; then
                echo "Elimino backups/$folder"
                rm -rf "private-backup/backups/$folder"
              fi
            done
          else
            echo "Backup presenti dopo il nuovo salvataggio: ${#backup_folders[@]}. Nessuna pulizia necessaria."
          fi

          cd private-backup
          git config user.name "firebase-backup-bot"
          git config user.email "firebase-backup-bot@users.noreply.github.com"
          git add backups/

          if git diff --cached --quiet; then
            echo "Nessun nuovo backup da salvare."
            exit 0
          fi

          git commit -m "Backup Firebase $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main
