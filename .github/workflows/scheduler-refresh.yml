name: Refresh scheduled workflow registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable and re-enable scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable firebase-backup-auto.yml --repo "$GH_REPO" || true
          sleep 2
          gh workflow enable firebase-backup-auto.yml --repo "$GH_REPO"
          echo "Scheduled workflow registration refreshed."
