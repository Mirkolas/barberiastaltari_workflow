name: Ripristino Firebase

on:
  workflow_dispatch:
    inputs:
      backup_folder:
        description: 'Cartella del backup nel repository privato'
        required: true
        type: string
      confirmation:
        description: 'Scrivi esattamente RIPRISTINA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Controlla conferma
        run: |
          if [ "${{ inputs.confirmation }}" != "RIPRISTINA" ]; then
            echo "Conferma non valida."
            exit 1
          fi

      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica repository privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installa dipendenze
        working-directory: source
        run: npm install

      - name: Controlla backup
        working-directory: source
        shell: bash
        run: |
          folder="${{ inputs.backup_folder }}"
          if [ ! -d "$folder" ]; then
            echo "Cartella backup inesistente."
            exit 1
          fi
          for file in firestore.json authentication.json metadata.json; do
            if [ ! -f "$folder/$file" ]; then
              echo "$file non trovato."
              exit 1
            fi
          done
          echo "Backup selezionato e struttura verificata."

      - name: Ripristina Firebase
        working-directory: source
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node restore.js "${{ inputs.backup_folder }}" "${{ inputs.confirmation }}"
