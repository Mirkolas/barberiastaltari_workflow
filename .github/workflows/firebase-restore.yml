name: Ripristino Firebase

on:
  workflow_dispatch:
    inputs:
      backup_folder:
        description: 'Percorso della cartella di backup nel repository privato'
        required: true
        type: string
      confirmation:
        description: 'Scrivi esattamente RIPRISTINA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BACKUP_FOLDER: ${{ inputs.backup_folder }}
      RESTORE_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Verifica configurazione e conferma
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done
          if [ "$RESTORE_CONFIRMATION" != "RIPRISTINA" ]; then
            echo "::error::Conferma non valida."
            exit 1
          fi

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa dipendenze
        working-directory: source
        run: npm install

      - name: Controlla backup
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$BACKUP_FOLDER" ]; then
            echo "::error::Cartella backup inesistente."
            exit 1
          fi
          for file in firestore.json authentication.json metadata.json; do
            if [ ! -f "$BACKUP_FOLDER/$file" ]; then
              echo "::error::File di backup mancante: $file"
              exit 1
            fi
          done

      - name: Ripristina Firebase
        working-directory: source
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node restore.js "$BACKUP_FOLDER" "$RESTORE_CONFIRMATION"
