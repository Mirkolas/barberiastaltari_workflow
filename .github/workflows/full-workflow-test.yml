name: Full workflow test launcher

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verifica configurazione senza modificare la produzione
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run configuration-test.yml --ref main
          echo 'Verifica configurazione accodata; nessun deploy, backup o restore eseguito.'
