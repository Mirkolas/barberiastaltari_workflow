name: Verifica runner senza credenziali
on:
  push:
    paths: ['*.js', 'package*.json', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['*.js', 'package*.json', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
