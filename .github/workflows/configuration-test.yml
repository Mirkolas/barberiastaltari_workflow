name: Configuration test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configuration-test.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch o commit del sorgente da verificare'
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Verifica configurazione senza mostrare valori
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configurazione mancante: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          node -e 'JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log("FIREBASE_SERVICE_ACCOUNT: JSON valido")'

      - name: Prova accesso al repository privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: ${{ inputs.source_ref || 'main' }}
          path: private-source-test
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configura Java per Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installa dipendenze di test bloccate
        working-directory: private-source-test/barberiastaltari
        run: npm ci

      - name: Verifica comportamento delle prenotazioni e delle email
        working-directory: private-source-test/barberiastaltari
        run: npm run test:behavior

      - name: Verifica regole su database demo isolato
        working-directory: private-source-test/barberiastaltari
        run: npx --yes firebase-tools@15.28.2 emulators:exec --config firebase.test.json --project demo-staltari-audit --only firestore 'node --test tests/firestore.test.mjs'

      - name: Esegui test applicazione senza deploy
        working-directory: private-source-test/barberiastaltari
        run: npm test

# Retest after PRIVATE_REPO_PAT setup
